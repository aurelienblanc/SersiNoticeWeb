# Replace notices.entreprise.example with the real internal DNS name.
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;

server {
    listen 80;
    server_name notices.entreprise.example;
    server_tokens off;
    return 308 https://notices.entreprise.example$request_uri;
}

server {
    listen 443 ssl;
    server_name notices.entreprise.example;
    server_tokens off;

    ssl_certificate /etc/nginx/tls/notices.crt;
    ssl_certificate_key /etc/nginx/tls/notices.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SERSI_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 52m;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    location / {
        proxy_pass http://web:8000;
    }
    location = /admin/login/ {
        limit_req zone=admin_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://web:8000;
    }
    location = /admin/maintenance/backups/upload/ {
        client_max_body_size 2050m;
        client_body_timeout 300s;
        proxy_read_timeout 300s;
        proxy_pass http://web:8000;
    }
}
